# Default values for the intranet Excalidraw deployment.
# Values marked "required" have no usable default.

image:
  # required: where your CI pushes the image built from deploy/docker/Dockerfile
  repository: registry.intranet.example/excalidraw-intranet
  # defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

# required: external URL of the app, origin only (no path)
publicUrl: "https://excalidraw.intranet.example"

oidc:
  # required: Keycloak realm URL, e.g. https://sso.intranet.example/realms/company
  issuerUrl: ""
  clientId: excalidraw
  # client secret of the confidential Keycloak client: set it here or
  # reference an existing secret (recommended)
  clientSecret: ""
  existingSecret: ""
  existingSecretKey: oidc-client-secret
  # Keycloak role that makes a user an Excalidraw admin
  adminRole: excalidraw-admin
  # Keycloak role a user needs to use Excalidraw at all; empty = everybody
  requiredRole: ""
  # claim paths with role lists; empty = realm roles + client roles
  rolesClaims: ""
  # claim with the group list (Keycloak "Group Membership" mapper)
  groupsClaim: groups
  scopes: "openid profile email"
  # where Keycloak sends the browser after logout; empty = publicUrl
  postLogoutRedirectUrl: ""

session:
  ttlHours: 10

# Master key that encrypts the per-scene keys (envelope encryption).
# required: 32 random bytes, base64 (`openssl rand -base64 32`).
# Back it up: without it, stored scenes can no longer be decrypted.
encryption:
  key: ""
  existingSecret: ""
  existingSecretKey: data-encryption-key

# REST API (/api/v1) and MCP server (/mcp) with personal API tokens
api:
  enabled: true
  mcpEnabled: true
  # longest validity of a token in days
  tokenMaxDays: 365
  # tokens work only if their person signed in within this many days (0 = off)
  loginMaxAgeDays: 30
  # Keycloak role needed to create and use tokens; empty = everyone
  requiredRole: ""
  # requests per token and minute
  rateLimitPerMinute: 300

database:
  # PostgreSQL connection string, e.g.
  # postgres://excalidraw:secret@postgres.db.svc:5432/excalidraw?sslmode=require
  url: ""
  existingSecret: ""
  existingSecretKey: database-url
  poolSize: 10

storage:
  # "postgres" keeps images in the database, "s3" in an S3-compatible bucket
  driver: postgres
  s3:
    endpoint: ""
    region: us-east-1
    bucket: ""
    forcePathStyle: true
    prefix: ""
    accessKeyId: ""
    secretAccessKey: ""
    # secret with the keys s3-access-key-id and s3-secret-access-key
    existingSecret: ""

limits:
  maxFileSizeMb: 25
  maxSceneSizeMb: 50
  maxShareLinkSizeMb: 50
  # longest image side in pixels, 3840 = 4K
  maxImageDimension: 3840

realtime:
  # share collaboration rooms across pods through PostgreSQL.
  # "auto" enables it when more than one pod can run.
  cluster: auto

csp:
  # extra origins whose pages may be embedded into drawings (embeddables)
  frameSrc: []
  # origins that may embed Excalidraw in an iframe (e.g. your wiki)
  frameAncestors: []

# trusted reverse proxy hops in front of the pods (the ingress controller)
# Deletion periods and history (S3 Löschkonzept, W5 trash, W7 versions)
retention:
  # days in the trash; default for new workspaces, each workspace can set
  # its own on the admin page
  trashDays: 30
  # versions are deleted after this many days
  versionDays: 90
  # at most one version per scene within this many minutes
  versionIntervalMinutes: 10
  # audit log (logins, sharing, exports, admin actions)
  auditDays: 365
  # "recently opened" entries
  visitDays: 180

search:
  # also index texts in drawings and comments (as keyed hashes, no plain
  # words in the database); false = search scene names only
  content: true

# AI with your own language model (K1, K2): any OpenAI-compatible endpoint
# (vLLM, Ollama, LiteLLM, Azure OpenAI). Empty baseUrl = no AI.
ai:
  # e.g. http://vllm.ki.svc:8000/v1
  baseUrl: ""
  # model for text to diagram, e.g. google/gemma-4-31b-it or qwen3.8-27b
  model: ""
  # model that understands images, for wireframe to code; empty = off
  visionModel: ""
  # API key of the endpoint, if it needs one (or existingSecret)
  apiKey: ""
  existingSecret: ""
  existingSecretKey: ai-api-key
  maxTokens: 4096
  timeoutSeconds: 180
  # defaults; admins change them under /admin -> KI
  dailyLimit: 50
  requiredRole: ""

# e-mail notifications through your SMTP relay (Z3); empty host = in-app only
smtp:
  host: ""
  port: 25
  # TLS from the start (port 465); otherwise STARTTLS when offered
  secure: false
  user: ""
  password: ""
  existingSecret: ""
  existingSecretKey: smtp-password
  from: "Excalidraw <excalidraw@intranet.example>"
  # minutes an unread notification waits before it is e-mailed
  delayMinutes: 10

# intranet pages that may embed scenes (T3), as CSP frame-ancestors;
# empty = https://*.<parent domain of publicUrl>
embed:
  frameAncestors: []

# Prometheus metrics on a port of their own (not exposed by the ingress)
metrics:
  enabled: true
  port: 9464
  serviceMonitor:
    # needs the Prometheus operator (monitoring.coreos.com CRDs)
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

# Nightly pg_dump into a volume. Scenes, comments and versions stay
# encrypted in the dump: back up the DATA_ENCRYPTION_KEY separately, a dump
# without it cannot be read. With storage.driver=s3 back up the bucket too
# (e.g. versioning or replication in the S3 system).
backup:
  enabled: false
  schedule: "30 2 * * *"
  image: postgres:16-alpine
  # number of dumps to keep
  keep: 14
  # volume for the dumps: an existing claim or a new one of this size
  existingClaim: ""
  storage: 20Gi
  storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

trustProxy: "1"
logLevel: info

# PEM bundle of your internal CA, used for TLS to Keycloak, S3 and PostgreSQL
extraCaCerts:
  configMap: ""
  key: ca.crt

extraEnv: []
extraEnvFrom: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  # empty = host of publicUrl
  host: ""
  annotations:
    # ingress-nginx: uploads up to the scene limit, long-lived websockets
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    enabled: true
    secretName: excalidraw-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

networkPolicy:
  # restrict ingress to the ingress controller namespace
  enabled: false
  ingressControllerNamespace: ingress-nginx
  # namespace of Prometheus, allowed to scrape the metrics port
  monitoringNamespace: monitoring

# Single-instance PostgreSQL for test environments only. Use a managed or
# operator-run PostgreSQL (e.g. CloudNativePG) in production.
postgresql:
  enabled: false
  image: postgres:16-alpine
  database: excalidraw
  username: excalidraw
  # required when enabled
  password: ""
  storage: 10Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
