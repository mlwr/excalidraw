{{- if include "excalidraw.needsSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "excalidraw.secretName" . }}
  labels:
    {{- include "excalidraw.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if and .Values.encryption.key (not .Values.encryption.existingSecret) }}
  data-encryption-key: {{ .Values.encryption.key | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  {{- $pg := .Values.postgresql }}
  {{- /* the password is passed separately (PGPASSWORD), so it needs no URL encoding */}}
  database-url: {{ printf "postgres://%s@%s:5432/%s" $pg.username (include "excalidraw.postgresqlName" .) $pg.database | quote }}
  postgres-password: {{ required "postgresql.password is required when postgresql.enabled=true" $pg.password | quote }}
  {{- else if and .Values.database.url (not .Values.database.existingSecret) }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.ai.apiKey (not .Values.ai.existingSecret) }}
  ai-api-key: {{ .Values.ai.apiKey | quote }}
  {{- end }}
  {{- if and .Values.smtp.password (not .Values.smtp.existingSecret) }}
  smtp-password: {{ .Values.smtp.password | quote }}
  {{- end }}
  {{- if and (eq .Values.storage.driver "s3") (not .Values.storage.s3.existingSecret) }}
  s3-access-key-id: {{ required "storage.s3.accessKeyId is required" .Values.storage.s3.accessKeyId | quote }}
  s3-secret-access-key: {{ required "storage.s3.secretAccessKey is required" .Values.storage.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
