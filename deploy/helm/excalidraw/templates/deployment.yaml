{{- $fullname := include "excalidraw.fullname" . -}}
{{- $secretName := include "excalidraw.secretName" . -}}
{{- if not .Values.oidc.issuerUrl }}
{{- fail "oidc.issuerUrl is required (e.g. https://sso.intranet.example/realms/company)" }}
{{- end }}
{{- if not (or .Values.oidc.clientSecret .Values.oidc.existingSecret) }}
{{- fail "set oidc.clientSecret or oidc.existingSecret (confidential Keycloak client)" }}
{{- end }}
{{- if not (or .Values.database.url .Values.database.existingSecret .Values.postgresql.enabled) }}
{{- fail "set database.url, database.existingSecret or postgresql.enabled" }}
{{- end }}
{{- if not (or .Values.encryption.key .Values.encryption.existingSecret) }}
{{- fail "set encryption.key or encryption.existingSecret (32 random bytes, base64: openssl rand -base64 32)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "excalidraw.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "excalidraw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "excalidraw.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "excalidraw.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: excalidraw
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: PUBLIC_URL
              value: {{ required "publicUrl is required" .Values.publicUrl | quote }}
            - name: PORT
              value: "8080"
            - name: TRUST_PROXY
              value: {{ .Values.trustProxy | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.oidc.existingSecret }}
                  name: {{ .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.existingSecretKey }}
                  {{- else }}
                  name: {{ $secretName }}
                  key: oidc-client-secret
                  {{- end }}
            - name: OIDC_ADMIN_ROLE
              value: {{ .Values.oidc.adminRole | quote }}
            - name: OIDC_REQUIRED_ROLE
              value: {{ .Values.oidc.requiredRole | quote }}
            {{- with .Values.oidc.rolesClaims }}
            - name: OIDC_ROLES_CLAIMS
              value: {{ . | quote }}
            {{- end }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ .Values.oidc.groupsClaim | quote }}
            - name: OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            {{- with .Values.oidc.postLogoutRedirectUrl }}
            - name: OIDC_POST_LOGOUT_REDIRECT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.encryption.existingSecret }}
                  name: {{ .Values.encryption.existingSecret }}
                  key: {{ .Values.encryption.existingSecretKey }}
                  {{- else }}
                  name: {{ $secretName }}
                  key: data-encryption-key
                  {{- end }}
            - name: API_ENABLED
              value: {{ .Values.api.enabled | quote }}
            - name: MCP_ENABLED
              value: {{ .Values.api.mcpEnabled | quote }}
            - name: API_TOKEN_MAX_DAYS
              value: {{ .Values.api.tokenMaxDays | quote }}
            - name: API_TOKEN_LOGIN_MAX_AGE_DAYS
              value: {{ .Values.api.loginMaxAgeDays | quote }}
            {{- if .Values.api.requiredRole }}
            - name: API_REQUIRED_ROLE
              value: {{ .Values.api.requiredRole | quote }}
            {{- end }}
            - name: API_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.api.rateLimitPerMinute | quote }}
            - name: SESSION_TTL_HOURS
              value: {{ .Values.session.ttlHours | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.database.existingSecret }}
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
                  {{- else }}
                  name: {{ $secretName }}
                  key: database-url
                  {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: postgres-password
            {{- end }}
            - name: DATABASE_POOL_SIZE
              value: {{ .Values.database.poolSize | quote }}
            - name: TRASH_RETENTION_DAYS
              value: {{ .Values.retention.trashDays | quote }}
            - name: VERSION_RETENTION_DAYS
              value: {{ .Values.retention.versionDays | quote }}
            - name: VERSION_INTERVAL_MINUTES
              value: {{ .Values.retention.versionIntervalMinutes | quote }}
            - name: AUDIT_RETENTION_DAYS
              value: {{ .Values.retention.auditDays | quote }}
            - name: VISIT_RETENTION_DAYS
              value: {{ .Values.retention.visitDays | quote }}
            - name: SEARCH_CONTENT
              value: {{ .Values.search.content | quote }}
            {{- if .Values.ai.baseUrl }}
            - name: AI_BASE_URL
              value: {{ .Values.ai.baseUrl | quote }}
            - name: AI_MODEL
              value: {{ required "ai.model is required with ai.baseUrl" .Values.ai.model | quote }}
            - name: AI_VISION_MODEL
              value: {{ .Values.ai.visionModel | quote }}
            - name: AI_MAX_TOKENS
              value: {{ .Values.ai.maxTokens | quote }}
            - name: AI_TIMEOUT_SECONDS
              value: {{ .Values.ai.timeoutSeconds | quote }}
            - name: AI_DAILY_LIMIT
              value: {{ .Values.ai.dailyLimit | quote }}
            - name: AI_REQUIRED_ROLE
              value: {{ .Values.ai.requiredRole | quote }}
            {{- if or .Values.ai.apiKey .Values.ai.existingSecret }}
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ai.existingSecret | default $secretName }}
                  key: {{ .Values.ai.existingSecretKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.smtp.host }}
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_SECURE
              value: {{ .Values.smtp.secure | quote }}
            - name: SMTP_FROM
              value: {{ .Values.smtp.from | quote }}
            - name: SMTP_USER
              value: {{ .Values.smtp.user | quote }}
            {{- if or .Values.smtp.password .Values.smtp.existingSecret }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret | default $secretName }}
                  key: {{ .Values.smtp.existingSecretKey }}
            {{- end }}
            - name: NOTIFY_EMAIL_DELAY_MINUTES
              value: {{ .Values.smtp.delayMinutes | quote }}
            {{- end }}
            {{- with .Values.embed.frameAncestors }}
            - name: EMBED_FRAME_ANCESTORS
              value: {{ join " " . | quote }}
            {{- end }}
            - name: METRICS_PORT
              value: {{ ternary .Values.metrics.port 0 .Values.metrics.enabled | quote }}
            - name: STORAGE_DRIVER
              value: {{ .Values.storage.driver | quote }}
            {{- if eq .Values.storage.driver "s3" }}
            - name: S3_ENDPOINT
              value: {{ required "storage.s3.endpoint is required" .Values.storage.s3.endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: S3_BUCKET
              value: {{ required "storage.s3.bucket is required" .Values.storage.s3.bucket | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.storage.s3.forcePathStyle | quote }}
            - name: S3_PREFIX
              value: {{ .Values.storage.s3.prefix | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret | default $secretName }}
                  key: s3-access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret | default $secretName }}
                  key: s3-secret-access-key
            {{- end }}
            - name: MAX_FILE_SIZE_MB
              value: {{ .Values.limits.maxFileSizeMb | quote }}
            - name: MAX_SCENE_SIZE_MB
              value: {{ .Values.limits.maxSceneSizeMb | quote }}
            - name: MAX_SHARE_LINK_SIZE_MB
              value: {{ .Values.limits.maxShareLinkSizeMb | quote }}
            - name: MAX_IMAGE_DIMENSION
              value: {{ .Values.limits.maxImageDimension | quote }}
            - name: REALTIME_CLUSTER
              value: {{ include "excalidraw.realtimeCluster" . | quote }}
            - name: CSP_FRAME_SRC
              value: {{ join " " .Values.csp.frameSrc | quote }}
            - name: CSP_FRAME_ANCESTORS
              value: {{ join " " .Values.csp.frameAncestors | quote }}
            {{- if .Values.extraCaCerts.configMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/excalidraw/ca/{{ .Values.extraCaCerts.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.extraCaCerts.configMap }}
            - name: ca-certs
              mountPath: /etc/excalidraw/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.extraCaCerts.configMap }}
        - name: ca-certs
          configMap:
            name: {{ .Values.extraCaCerts.configMap }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
