{{- if .Values.backup.enabled }}
{{- $fullname := include "excalidraw.fullname" . -}}
{{- $secretName := include "excalidraw.secretName" . -}}
{{- if not .Values.backup.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-backup
  labels:
    {{- include "excalidraw.labels" . | nindent 4 }}
  annotations:
    # dumps outlive an uninstall
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backup.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-backup
  labels:
    {{- include "excalidraw.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  file="/backup/excalidraw-$(date +%Y%m%d-%H%M%S).dump"
                  pg_dump --format=custom --no-owner --file="$file.partial" "$DATABASE_URL"
                  mv "$file.partial" "$file"
                  ls -1t /backup/excalidraw-*.dump | tail -n +$((KEEP + 1)) | xargs -r rm -f --
                  echo "backup written: $file ($(du -h "$file" | cut -f1))"
              env:
                - name: KEEP
                  value: {{ .Values.backup.keep | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      {{- if .Values.database.existingSecret }}
                      name: {{ .Values.database.existingSecret }}
                      key: {{ .Values.database.existingSecretKey }}
                      {{- else }}
                      name: {{ $secretName }}
                      key: database-url
                      {{- end }}
                {{- if .Values.postgresql.enabled }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secretName }}
                      key: postgres-password
                {{- end }}
                {{- if .Values.extraCaCerts.configMap }}
                - name: PGSSLROOTCERT
                  value: /etc/excalidraw/ca/{{ .Values.extraCaCerts.key }}
                {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
                {{- if .Values.extraCaCerts.configMap }}
                - name: ca-certs
                  mountPath: /etc/excalidraw/ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ .Values.backup.existingClaim | default (printf "%s-backup" $fullname) }}
            - name: tmp
              emptyDir: {}
            {{- if .Values.extraCaCerts.configMap }}
            - name: ca-certs
              configMap:
                name: {{ .Values.extraCaCerts.configMap }}
            {{- end }}
{{- end }}
